# ── Status / timing ──────────────────────────────────────────────────
set -g status-interval 1
set -g escape-time 40
set -g repeat-time 350
set -g display-time 1500

# ── Terminal colors (fixes washed-out / wrong colors inside tmux) ─────
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:RGB'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -as terminal-features ',*:sync'
# Claude Code (and other Node TUIs) otherwise fall back to 256-colour inside
# tmux, turning dark backgrounds into xterm 17 NavyBlue.
set-environment -g FORCE_COLOR 3

# ── Settings ─────────────────────────────────────────────────────────
set -g history-limit 20000
set -g set-clipboard on
set -g wrap-search off
set -g mouse on
set -g allow-passthrough all
set -g visual-activity off
set -g focus-events on
set -g detach-on-destroy off
set -g mode-keys vi

# ── Visual ───────────────────────────────────────────────────────────
set -g set-titles on
set -g set-titles-string "#S: #{window_name} at #H "
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# ── Keybindings ──────────────────────────────────────────────────────
unbind r
bind r source-file ~/.tmux.conf \; display-message "#[fg=yellow]✨ Config reloaded!"

bind s display-popup -E -w 40% -h 40% -S "fg=#{@thm_peach}" -b rounded \
          "tmux list-sessions -F '#S' | fzf --reverse --border=none \
          --prompt='  ' --pointer='▌' --no-scrollbar \
          | xargs -I{} tmux switch-client -t {}"

# ── Catppuccin ───────────────────────────────────────────────────────
# flavor: latte | frappe | macchiato | mocha
# Matches ghostty's `dark:Catppuccin Mocha` and nvim's catppuccin-mocha.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# square, not rounded
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

# window segments: [number][name], window name not pane title
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"

# dark name blocks (catppuccin defaults are surface_0/surface_1 = too light)
set -g @catppuccin_window_text_color "#{@thm_mantle}"
set -g @catppuccin_window_current_text_color "#{@thm_bg}"
set -g @catppuccin_window_number_color "#{@thm_overlay_1}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"

# Cloned and pinned by `dot tmux-plugins` — see lib/tmux.sh.
run ~/.tmux/plugins/tmux/catppuccin.tmux

# ── Everything below must come AFTER catppuccin loads ────────────────

# Status bar
set -g status-position bottom
set -g status-style "bg=#{@thm_mantle}"
set -g status-justify "left"

# status left — session name only
set -g status-left-length 80
set -g status-left ""
set -ga status-left "#[fg=#{@thm_green}]#{?client_prefix,#[fg=#{@thm_red}],} 󱗜 #S 󰅂  #[none]"

# status right — deliberately empty. Path, host and clock all live elsewhere
# (shell prompt, window names, menu bar), so repeating them here is noise.
set -g status-right-length 0
set -g status-right ""

# pane border
setw -g pane-border-status off
setw -g pane-border-format ""
setw -g pane-active-border-style "fg=#{@thm_peach},bg=default"
setw -g pane-border-style "fg=#{@thm_overlay_2},bg=default"
setw -g pane-border-lines single

# popup
setw -g popup-border-style "fg=#{@thm_peach},bg=default"

# command line
set -g message-style "bg=#{@thm_surface_0}, fg=#{@thm_fg}, fill=#{@thm_surface_0}"
set -g message-command-style "bg=#{@thm_mantle}, fg=#{@thm_fg}, fill=#{@thm_mantle}"

# window status — formats come from catppuccin (basic/square); do not override
set -g window-status-separator ""
